name: GrabnBite backend build

on:
  push:
    branches:
      - fix/core-order-flow-theme
    paths:
      - "GrabnBite/GrabnBite/**"
      - "GrabnBite/GrabnBite.sln"
      - ".github/workflows/grabnbite-backend-build.yml"
  pull_request:
    paths:
      - "GrabnBite/GrabnBite/**"
      - "GrabnBite/GrabnBite.sln"
      - ".github/workflows/grabnbite-backend-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Restore and build ASP.NET Core API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore GrabnBite/GrabnBite.sln

      - name: Build API
        run: dotnet build GrabnBite/GrabnBite.sln --configuration Release --no-restore
